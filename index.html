<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thư viện Gnosis Hà Nội</title>
    <meta name="description" content="Thư viện sách nói và sách hình Gnosis Hà Nội dành cho học hỏi, chiêm nghiệm và chuyển hóa nội tâm.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="vi_VN">
    <meta property="og:site_name" content="Thư viện Gnosis Hà Nội">
    <meta property="og:title" content="Thư viện Gnosis Hà Nội">
    <meta property="og:description" content="Tri thức cho hành trình nội tâm.">
    <meta property="og:url" content="https://audio.gnosishanoi.org/">
    <meta property="og:image" content="https://audio.gnosishanoi.org/assets/social/gnosis-hanoi-library-v3.jpg">
    <meta property="og:image:secure_url" content="https://audio.gnosishanoi.org/assets/social/gnosis-hanoi-library-v3.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Thư viện Gnosis Hà Nội trong một không gian đọc tĩnh lặng">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Thư viện Gnosis Hà Nội">
    <meta name="twitter:description" content="Tri thức cho hành trình nội tâm.">
    <meta name="twitter:image" content="https://audio.gnosishanoi.org/assets/social/gnosis-hanoi-library-v3.jpg">
    <meta name="twitter:image:alt" content="Thư viện Gnosis Hà Nội trong một không gian đọc tĩnh lặng">
    <meta name="theme-color" content="#233027">
    <meta name="apple-mobile-web-app-title" content="Gnosis Hà Nội">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="./assets/icons/gnosis-favicon.svg?v=1" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css?v=gnosis-editorial-39">
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Trang chủ Thư viện Gnosis Hà Nội">
          <img class="brand-logo" src="./assets/branding/gnosis-hanoi-logo-transparent.png" alt="Gnosis Hà Nội" width="650" height="216">
          <span class="brand-copy">
            <span class="brand-name">Thư viện Gnosis</span>
            <span class="brand-subtitle">Tri thức cho hành trình nội tâm</span>
          </span>
        </a>
        <a class="header-library-link" href="./" aria-label="Quay lại thư viện">← Thư viện</a>
        <button class="ghost-button" id="headerContinueBtn" type="button" hidden>Tiếp tục</button>
      </header>

      <main>
        <section class="library-hero" id="libraryHero">
          <div class="featured-visual" id="featuredVisual">
            <img class="featured-scene" id="featuredImage" src="./assets/hero/xu-xo-cua-cac-vi-than-reading-v1.jpg" alt="">
          </div>
          <div class="featured-panel">
            <div class="hero-copy">
              <p class="eyebrow" id="featuredEyebrow">Tác phẩm nổi bật</p>
              <h1 id="featuredTitle">Xứ xở của các vị thần</h1>
              <p class="featured-author" id="featuredAuthor">H. P. Blavatsky</p>
              <p class="hero-description" id="featuredDescription">Cuộc diện kiến các Chân sư Minh triết ở Shambhala.</p>
              <a class="primary-button featured-button" id="featuredLink" href="#book/xu-xo-cua-cac-vi-than">Khám phá</a>
            </div>
            <div class="resume-panel" id="resumePanel" hidden>
              <span class="panel-label">Lần nghe gần nhất</span>
              <strong id="resumeTitle">Tiếp tục nghe</strong>
              <span id="resumeMeta">Chương 1</span>
              <button class="primary-button" id="heroContinueBtn" type="button">Tiếp tục nghe</button>
            </div>
          </div>
        </section>

        <section id="libraryView" class="view">
          <div class="section-heading">
            <span class="section-rule" aria-hidden="true"></span>
            <h2>Thư viện</h2>
            <span class="section-rule" aria-hidden="true"></span>
            <div class="library-tools">
              <p id="bookCount"></p>
              <button class="text-button small-text-button" id="hiddenToggleBtn" type="button" hidden>Hidden</button>
            </div>
          </div>
          <div class="book-grid" id="bookGrid"></div>
          <div class="hidden-books" id="hiddenBooksPanel" hidden></div>
        </section>

        <section id="bookView" class="view book-view" hidden>
          <button class="text-button" id="backBtn" type="button">Quay lại thư viện</button>
          <div class="book-detail" id="bookDetail"></div>
        </section>
      </main>
    </div>

    <aside class="player-bar" id="playerBar" hidden aria-label="Trình phát sách nói">
      <div class="player-info">
        <img id="playerCover" alt="" width="54" height="54">
        <div>
          <strong id="playerTitle">Chọn một chương</strong>
          <span id="playerChapter">Sẵn sàng</span>
        </div>
      </div>
      <div class="player-controls">
        <button class="round-button" id="playPauseBtn" type="button" aria-label="Phát">Phát</button>
        <div class="timeline">
          <input id="seekBar" type="range" min="0" max="1000" value="0" aria-label="Tua audio">
          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="durationTime">0:00</span>
          </div>
        </div>
      </div>
      <audio id="audioPlayer" preload="metadata"></audio>
    </aside>

    <script src="./app.js?v=gnosis-editorial-39" defer></script>
  </body>
</html>
